name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  COMPOSER_ROOT_VERSION: dev-main

jobs:
  metadata:
    name: Package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:2.10.2
      - run: composer validate --strict
      - run: composer audit --locked --abandoned=fail

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1

  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:2.10.2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test
      # Packagist installs the committed PHAR, so check that it is the newest
      # release and still starts on this PHP version, outside the project.
      - name: Smoke-test the committed PHAR
        run: |
          phar="$GITHUB_WORKSPACE/builds/quickpay"
          released="$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')"
          test "$(php "$phar" --version)" = "Quickpay $released"
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          cd "$RUNNER_TEMP"
          php "$phar" list --raw > commands.txt
          grep -q '^about ' commands.txt
          php "$phar" about > /dev/null
          if output="$(php "$phar" payments:list --no-interaction 2>&1)"; then
            echo "payments:list should fail without a merchant."
            exit 1
          fi
          if grep -qiE 'fatal|uncaught|stack trace' <<< "$output"; then
            echo "$output"
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer:2.10.2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer coverage

  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:2.10.2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer analyse

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:2.10.2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer format:test
