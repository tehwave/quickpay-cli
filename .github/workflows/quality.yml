name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test

  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer analyse

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer format:test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: test -x builds/quickpay
      - run: builds/quickpay --version
      - run: builds/quickpay list
      - run: php scripts/verify-phar-source.php builds/quickpay
      - run: composer build
      - run: builds/quickpay --version
      - run: builds/quickpay list
      - run: php scripts/verify-phar-source.php builds/quickpay
